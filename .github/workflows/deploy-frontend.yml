
name: Build and Deploy Frontend to Azure

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build React application
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://movie-theater-api-ehd3e4epgqeea6ab.switzerlandnorth-01.azurewebsites.net/api

      # 5. Prepare deployment package
      - name: Prepare deployment package
        run: |
          mkdir deploy
          cp -r frontend/dist deploy/dist
          cp frontend/server.js deploy/server.js
          cp frontend/package.json deploy/package.json
          cp frontend/package-lock.json deploy/package-lock.json

      # 6. Upload artifact
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 7. Download artifact
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: .

      # 8. Deploy to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: rio-theater-frontend
          slot-name: Production
          package: .
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
